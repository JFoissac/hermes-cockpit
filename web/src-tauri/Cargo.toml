[package]
name = "hermes-cockpit-desktop"
version = "0.1.0"
edition = "2021"
description = "Coque desktop Tauri de Hermes Cockpit"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
